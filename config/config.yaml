application:
  name: "Document Intelligence Console Enterprise"
  environment: "development"

runtime:
  input_directory: "input"
  output_directory: "output"
  log_directory: "logs"

output:
  save_json: true

database:
  enabled: true
  host: "127.0.0.1"
  port: 5432
  database: "rag"
  # The GUI exposes one Database field. Scope selection auto-fills the
  # canonical database below; users may still edit the current field manually.
  project_databases:
    21MM: "rag_21mm"
    24MM: "rag_24mm"
    COMMON: "rag"
    QABUG: "rag_qabug"
  user: "postgres"
  password_env: "POSTGRES_PASSWORD"
  connect_timeout: 10

chunk:
  max_length: 1000

logging:
  level: "INFO"
  file_name: "application.log"
